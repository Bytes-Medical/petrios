static_resources:
  listeners:
    - name: public
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: petrios
                use_remote_address: true
                normalize_path: true
                path_with_escaped_slashes_action: REJECT_REQUEST
                request_headers_timeout: 15s
                stream_idle_timeout: 300s
                route_config:
                  name: services
                  virtual_hosts:
                    - name: petrios
                      domains: ['*']
                      routes:
                        - match: { prefix: /auth/v1/ }
                          route: { cluster: auth, prefix_rewrite: /, timeout: 60s }
                        - match: { prefix: /rest/v1/ }
                          route: { cluster: rest, prefix_rewrite: /, timeout: 60s }
                        - match: { prefix: /storage/v1/ }
                          route: { cluster: storage, prefix_rewrite: /, timeout: 300s }
                        - match: { prefix: / }
                          route: { cluster: app, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.lua
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(h)
                          local path = h:headers():get(":path") or ""
                          -- Auth verify/callback and signed Storage URLs authenticate themselves.
                          if string.sub(path,1,9) == "/rest/v1/" then
                            local key = h:headers():get("apikey")
                            if key ~= "@@ANON@@" and key ~= "@@SERVICE@@" then
                              h:respond({[":status"]="401"}, "Unauthorized")
                              return
                            end
                            if not h:headers():get("authorization") then
                              h:headers():add("authorization", "Bearer " .. key)
                            end
                          end
                          local origin = h:headers():get("origin")
                          if origin and origin ~= "@@ORIGIN@@" then
                            h:respond({[":status"]="403"}, "Invalid origin")
                            return
                          end
                        end
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: app
      type: STRICT_DNS
      connect_timeout: 5s
      dns_lookup_family: ALL
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: '@@APP@@', port_value: 3000 }
    - name: auth
      type: STRICT_DNS
      connect_timeout: 5s
      dns_lookup_family: ALL
      load_assignment:
        cluster_name: auth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: '@@AUTH@@', port_value: 9999 }
    - name: rest
      type: STRICT_DNS
      connect_timeout: 5s
      dns_lookup_family: ALL
      load_assignment:
        cluster_name: rest
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: '@@REST@@', port_value: 3000 }
    - name: storage
      type: STRICT_DNS
      connect_timeout: 5s
      dns_lookup_family: ALL
      load_assignment:
        cluster_name: storage
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: '@@STORAGE@@', port_value: 5000 }
